version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: irmandade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: irmandade
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - irmandade-network

  redis:
    image: redis:7-alpine
    container_name: irmandade-redis
    ports:
      - '6379:6379'
    networks:
      - irmandade-network

  backend:
    build: ./backend
    container_name: irmandade-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/irmandade
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=sua-secreto-aqui
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - irmandade-network

volumes:
  postgres-data:

networks:
  irmandade-network:
    driver: bridge
